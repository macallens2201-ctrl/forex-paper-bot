name: Bot Risque Faible

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dependances
        run: pip install requests

      - name: Executer le bot (risque faible, compte demo)
        env:
          OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID_LOW }}
          RISK_PROFILE: LOW
        run: python forex_bot.py

      - name: Sauvegarder l'etat du bot
        run: |
          git config user.name "forex-bot-risque-faible"
          git config user.email "bot@users.noreply.github.com"
          git add bot_state_low.json
          git diff --quiet --cached || git commit -m "Mise a jour etat - risque faible"
          for i in 1 2 3 4 5; do
            git push && break
            echo "Push refuse (autre bot a pousse en meme temps), nouvel essai $i..."
            git pull --rebase origin main
            sleep $((RANDOM % 10 + 1))
          done
