name: Forex Paper Trading Bot

on:
  schedule:
    - cron: "*/15 * * * *"   # toutes les 15 minutes, 24h/24, gratuit sur GitHub
  workflow_dispatch: {}        # bouton "Run workflow" pour lancer manuellement

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dependances
        run: pip install requests

      - name: Executer le bot (compte demo uniquement)
        env:
          OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
        run: python forex_paper_bot_cloud.py

      - name: Sauvegarder le compteur de trades du jour
        run: |
          git config user.name "forex-paper-bot"
          git config user.email "bot@users.noreply.github.com"
          git add bot_state.json
          git diff --quiet --cached || git commit -m "Mise a jour etat du bot"
          git push
